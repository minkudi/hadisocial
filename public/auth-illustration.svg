<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 340" width="460" height="340" fill="none">
  <defs>
    <linearGradient id="cardGrad" x1="120" y1="90" x2="360" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b6ef5"/>
      <stop offset="1" stop-color="#2f42c9"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="255" y1="120" x2="365" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Fond : cercle doux + grille discrète -->
  <circle cx="230" cy="172" r="140" fill="#eef2ff"/>
  <circle cx="230" cy="172" r="98" fill="#e0e7ff" opacity="0.55"/>
  <g stroke="#c7d2fe" stroke-width="1.5" opacity="0.5">
    <path d="M60 250 H400"/>
    <path d="M84 282 H376"/>
  </g>

  <!-- Étincelles -->
  <g fill="#a5b4fc">
    <circle cx="88" cy="96" r="5"/>
    <circle cx="392" cy="128" r="4"/>
    <circle cx="348" cy="52" r="3.5"/>
  </g>
  <path d="M366 84 l3.4 7 7 3.4 -7 3.4 -3.4 7 -3.4 -7 -7 -3.4 7 -3.4 Z" fill="#c7d2fe"/>
  <path d="M118 60 l2.6 5.4 5.4 2.6 -5.4 2.6 -2.6 5.4 -2.6 -5.4 -5.4 -2.6 5.4 -2.6 Z" fill="#c7d2fe"/>

  <!-- Graphique : barres + flèche -->
  <g>
    <rect x="84" y="196" width="14" height="34" rx="4" fill="#a5b4fc"/>
    <rect x="104" y="180" width="14" height="50" rx="4" fill="#818cf8"/>
    <rect x="124" y="160" width="14" height="70" rx="4" fill="#6366f1"/>
    <path d="M88 148 C110 140 130 128 152 106" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
    <path d="M152 106 l-11 1.5 M152 106 l-2 11" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Pièces -->
  <g>
    <ellipse cx="366" cy="238" rx="26" ry="10" fill="#fcd34d"/>
    <rect x="340" y="222" width="52" height="16" fill="#fcd34d"/>
    <ellipse cx="366" cy="222" rx="26" ry="10" fill="#fde68a"/>
    <ellipse cx="366" cy="222" rx="26" ry="10" fill="#ffffff" opacity="0.25"/>
    <ellipse cx="376" cy="196" rx="18" ry="7" fill="#fcd34d"/>
    <rect x="358" y="184" width="36" height="12" fill="#fcd34d"/>
    <ellipse cx="376" cy="184" rx="18" ry="7" fill="#fde68a"/>
  </g>

  <!-- Carte bancaire -->
  <g transform="rotate(-8 210 170)">
    <rect x="110" y="110" width="200" height="126" rx="14" fill="url(#cardGrad)"/>
    <rect x="110" y="134" width="200" height="16" fill="#1e2a78" opacity="0.35"/>
    <rect x="128" y="166" width="30" height="22" rx="5" fill="#fcd34d"/>
    <g fill="#ffffff" opacity="0.9">
      <rect x="128" y="206" width="52" height="7" rx="3.5"/>
      <rect x="128" y="218" width="34" height="7" rx="3.5"/>
    </g>
    <g fill="#ffffff" opacity="0.85">
      <circle cx="272" cy="212" r="9" opacity="0.55"/>
      <circle cx="284" cy="212" r="9" opacity="0.75"/>
      <circle cx="296" cy="212" r="9"/>
    </g>
  </g>

  <!-- Bouclier de sécurité -->
  <g>
    <path d="M310 128 L358 146 V196 C358 228 340 252 310 264 C280 252 262 228 262 196 V146 Z"
          fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="6"/>
    <path d="M288 196 L304 212 L336 176" stroke="#ffffff" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
